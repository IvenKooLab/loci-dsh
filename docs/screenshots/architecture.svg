<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-label="loci-dsh architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="230" rx="14" fill="#0e1116"/>
  <rect x="0.5" y="0.5" width="919" height="229" rx="13.5" fill="none" stroke="#232a36"/>

  <!-- browser -->
  <rect x="30" y="55" width="240" height="115" rx="10" fill="#151b26" stroke="#7aa2f7" stroke-width="1.4"/>
  <text x="150" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#7aa2f7">BROWSER</text>
  <text x="150" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#e8ecf3">dsh Web UI</text>
  <text x="150" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#a8b1c2">loci-dsh client half</text>
  <text x="150" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7d879b">better-sidebar tab</text>

  <!-- dsh process -->
  <rect x="360" y="55" width="250" height="115" rx="10" fill="#171521" stroke="#b48ead" stroke-width="1.4"/>
  <text x="485" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" letter-spacing="1.5" fill="#b48ead">DSH PROCESS (NODE)</text>
  <text x="485" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#e8ecf3">loci-dsh host half</text>
  <text x="485" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#a8b1c2">/loci-dsh/api/* proxy</text>
  <text x="485" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7d879b">Host-header trust fence</text>

  <!-- loci -->
  <rect x="700" y="55" width="190" height="115" rx="10" fill="#12201a" stroke="#7ec98f" stroke-width="1.4"/>
  <text x="795" y="78" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" letter-spacing="1.2" fill="#7ec98f">LOCI SERVE-HTTP</text>
  <text x="795" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#e8ecf3">local REST API</text>
  <text x="795" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#a8b1c2">127.0.0.1:8765</text>
  <text x="795" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#7d879b">search · ask · remember</text>

  <!-- arrows -->
  <line x1="272" y1="112" x2="354" y2="112" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="313" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#7aa2f7">same-origin</text>
  <text x="313" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#7d879b">fetch</text>

  <line x1="612" y1="112" x2="694" y2="112" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="653" y="98" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#7aa2f7">HTTP + Bearer</text>

  <!-- caption -->
  <text x="460" y="205" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#66708a">pure UI layer — the browser never talks to loci directly, so loci needs no CORS</text>
</svg>
