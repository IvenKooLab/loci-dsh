name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # lib/ is a committed artifact; upload it so a machine that cannot run
      # rolldown (e.g. macOS codesign restrictions) can still commit the build
      - uses: actions/upload-artifact@v4
        with:
          name: lib-build
          path: lib/
          if-no-files-found: error
