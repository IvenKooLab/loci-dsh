# loci-dsh bundle: mount the node half (the /plugins/loci-dsh/api proxy routes).
#
# Installed through the official CLI:
#
#   dsh plugin --profile web add loci-dsh            # from npm
#   dsh plugin --profile web add github:IvenKooLab/loci-dsh   # from git (lib/ is committed)
#
# The plugin row accepts a `config:` block (or the LOCI_URL / LOCI_TOKEN env
# vars) pointing at your loci serve-http instance:
#
#   - insert:
#       - id: loci-dsh
#         name: 'loci-dsh'
#         config:
#           baseUrl: 'http://127.0.0.1:8765'
#           token: '<same value as [http] token in loci config.toml>'
- insert:
    - id: loci-dsh
      name: 'loci-dsh'
